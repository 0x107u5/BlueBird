site_name: BlueBird
site_url: https://0x107u5.github.io/BlueBird/
site_description: Conteúdo de defesa cibernética (Blue Team) em português
repo_url: https://github.com/0x107u5/BlueBird
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  logo: assets/arara.svg
  favicon: assets/arara.svg
  palette:
    scheme: slate
    primary: blue
    accent: light blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: pt
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{date}/{slug}"
      post_readtime: true
      archive_name: Arquivo
      categories_name: Categorias
      pagination_per_page: 10
      draft: false
      draft_on_serve: true
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Blog:
    - blog/index.md
  - Redes:
    - IPv4: Redes/IPv4.md
    - Portas: Redes/Portas.md
  - Sobre: sobre.md
